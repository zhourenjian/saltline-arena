# Saltline Arena — static site from /var/www/saltline + /ws game server on 127.0.0.1:8787
upstream saltline_backend {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name saltline.kakoola.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saltline.kakoola.com;

    ssl_certificate     /etc/nginx/ssl/saltline.crt;
    ssl_certificate_key /etc/nginx/ssl/saltline.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/saltline;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json text/plain image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # game server: WebSocket, small packets, long-lived
    location /ws {
        proxy_pass         http://saltline_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        tcp_nodelay         on;
    }
    location = /health {
        proxy_pass http://saltline_backend;
        proxy_set_header Host $host;
    }

    # hashed build output is immutable; the page and manifest are always revalidated
    location /assets/ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }
    location /fonts/ { expires 30d; add_header Cache-Control "public, max-age=2592000"; }
    location /avatars/ { expires 7d; add_header Cache-Control "public, max-age=604800"; }
    location /icons/ { expires 7d; add_header Cache-Control "public, max-age=604800"; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location / { try_files $uri =404; }
}
