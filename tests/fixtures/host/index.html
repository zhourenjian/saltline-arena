<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuoWorld test host</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      #mount {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="mount"></div>
    <script type="module">
      // A minimal stand-in for a DuoWorld host runtime: it only knows world.json. It owns the
      // single animation loop and the window.DuoWorld object, and drives the lifecycle.
      const pkg = new URL(
        new URLSearchParams(location.search).get("pkg") || "../pkg/",
        location.href,
      );
      const manifest = await (await fetch(new URL("world.json", pkg))).json();
      const mod = await import(new URL(manifest.entry, pkg).href);
      const createWorld = mod[manifest.entryExport || "default"];
      let world = null,
        raf = 0,
        last = 0,
        frames = 0;
      const loop = (t) => {
        raf = requestAnimationFrame(loop);
        const dt = (t - last) / 1000;
        last = t;
        if (world) {
          world.update(dt);
          frames++;
        }
      };
      window.DuoWorld = {
        __host: "test-host",
        setAvatar: (id) => world.setAvatar(id),
        getAvatar: () => world && world.getAvatar(),
        listAvatars: () => (world ? world.listAvatars() : []),
      };
      window.HOST = {
        manifest,
        get world() {
          return world;
        },
        get frames() {
          return frames;
        },
        async create() {
          world = createWorld({
            container: document.getElementById("mount"),
            avatarRoot: new URL("../avatars/", location.href).href,
            params: { q: "low", noaudio: "1" },
          });
          return world.state;
        },
        async load() {
          await world.load();
          return world.state;
        },
        async enter(ctx) {
          await world.enter(ctx || {});
          last = performance.now();
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(loop);
          return world.state;
        },
        async leave() {
          cancelAnimationFrame(raf);
          await world.leave();
          return world.state;
        },
        async dispose() {
          cancelAnimationFrame(raf);
          await world.dispose();
          return world.state;
        },
      };
      window.HOST_READY = true;
    </script>
  </body>
</html>
